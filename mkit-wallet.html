<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKiT 數字錢包 Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #111118;
    --bg-card: #1a1a2e;
    --bg-card-hover: #222238;
    --text-primary: #ffffff;
    --text-secondary: #888;
    --text-muted: #666;
    --accent-teal: #00d4aa;
    --accent-red: #ff6b6b;
    --accent-yellow: #ffd93d;
    --accent-purple: #a855f7;
    --accent-blue: #6bcbff;
    --accent-green: #4ade80;
    --border-color: rgba(255,255,255,0.08);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  
  [data-theme="light"] {
    --bg-primary: #f5f7fa;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #f0f2f5;
    --text-primary: #1a1a2e;
    --text-secondary: #666;
    --text-muted: #999;
    --border-color: rgba(0,0,0,0.1);
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: var(--bg-primary); 
    color: var(--text-primary); 
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app-container {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    z-index: 100;
    transition: transform 0.3s;
  }
  
  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px 24px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
  }
  
  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent-teal), var(--accent-blue));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  
  .logo-text {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-teal), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .nav-section {
    flex: 1;
  }
  
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 4px;
    font-size: 15px;
  }
  
  .nav-item:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
  }
  
  .nav-item.active {
    background: rgba(0,212,170,0.15);
    color: var(--accent-teal);
  }
  
  .nav-item svg { width: 22px; height: 22px; }
  
  .nav-divider {
    height: 1px;
    background: var(--border-color);
    margin: 16px 0;
  }
  
  .sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
  }
  
  /* Main Content */
  .main-content {
    flex: 1;
    margin-left: 260px;
    padding: 24px 32px;
    min-height: 100vh;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    gap: 24px;
  }
  
  .top-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  
  .menu-toggle {
    display: none;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  
  .greeting-block {
    display: flex;
    flex-direction: column;
  }
  
  .greeting { font-size: 14px; color: var(--text-secondary); }
  .user-name { font-size: 24px; font-weight: 700; }
  
  .search-box {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .search-box input:focus {
    border-color: var(--accent-teal);
  }
  
  .search-box input::placeholder {
    color: var(--text-muted);
  }
  
  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 18px;
    height: 18px;
  }
  
  .top-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  
  .theme-toggle:hover {
    background: var(--bg-card-hover);
  }
  
  .month-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  
  .month-badge:hover {
    background: var(--bg-card-hover);
  }

  /* Stats Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 28px;
  }
  
  .stat-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 20px 24px;
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }
  
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  
  .stat-card.income { border-left: 4px solid var(--accent-teal); }
  .stat-card.expense { border-left: 4px solid var(--accent-red); }
  .stat-card.balance { border-left: 4px solid var(--accent-purple); }
  .stat-card.savings { border-left: 4px solid var(--accent-green); }
  
  .stat-icon {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 32px;
    opacity: 0.12;
  }
  
  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  
  .stat-value.positive { color: var(--accent-teal); }
  .stat-value.negative { color: var(--accent-red); }
  .stat-value.purple { color: var(--accent-purple); }
  .stat-value.green { color: var(--accent-green); }
  
  .stat-trend {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .stat-trend.up { color: var(--accent-green); }
  .stat-trend.down { color: var(--accent-red); }

  /* Filter Bar */
  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  
  .filter-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  
  .filter-label {
    font-size: 13px;
    color: var(--text-secondary);
  }
  
  .filter-select {
    padding: 8px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  
  .filter-select:focus {
    border-color: var(--accent-teal);
  }
  
  .filter-select option {
    background: var(--bg-card);
    color: var(--text-primary);
  }
  
  .filter-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .filter-chip:hover, .filter-chip.active {
    background: rgba(0,212,170,0.15);
    color: var(--accent-teal);
    border-color: rgba(0,212,170,0.3);
  }

  /* Charts Grid */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }
  
  .chart-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border-color);
  }
  
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .chart-title {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .chart-period {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .chart-canvas-wrap {
    position: relative;
    height: 240px;
  }
  
  .chart-canvas-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  /* Budget Section */
  .budget-section {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border-color);
    margin-bottom: 28px;
  }
  
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .section-title {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .btn-add {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: rgba(0,212,170,0.15);
    color: var(--accent-teal);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .btn-add:hover {
    background: rgba(0,212,170,0.25);
  }
  
  .budget-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  
  .budget-item {
    background: var(--bg-primary);
    border-radius: 14px;
    padding: 18px;
    border: 1px solid var(--border-color);
  }
  
  .budget-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  
  .budget-cat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  
  .budget-amounts {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .budget-bar-bg {
    height: 8px;
    background: var(--border-color);
    border-radius: 4px;
    overflow: hidden;
  }
  
  .budget-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  
  .budget-bar-fill.green { background: linear-gradient(90deg, var(--accent-teal), var(--accent-green)); }
  .budget-bar-fill.yellow { background: linear-gradient(90deg, var(--accent-yellow), #ffb347); }
  .budget-bar-fill.red { background: linear-gradient(90deg, var(--accent-red), #ff4757); }
  
  .budget-alert {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent-red);
  }

  /* Transaction Section */
  .tx-section {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border-color);
    margin-bottom: 28px;
  }
  
  .tx-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .tx-count {
    font-size: 13px;
    color: var(--text-muted);
  }
  
  .tx-table {
    width: 100%;
    border-collapse: collapse;
  }
  
  .tx-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-color);
  }
  
  .tx-table td {
    padding: 16px;
    border-bottom: 1px solid var(--border-color);
    font-size: 14px;
  }
  
  .tx-table tr:hover td {
    background: var(--bg-card-hover);
  }
  
  .tx-icon-cell {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  
  .tx-name { font-weight: 500; }
  .tx-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 8px; }
  
  .tx-card-tag {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  
  .tx-card-tag.cathay { background: rgba(255,107,107,0.2); color: var(--accent-red); }
  .tx-card-tag.hsbc { background: rgba(0,200,255,0.2); color: var(--accent-blue); }
  .tx-card-tag.alipay { background: rgba(0,212,170,0.2); color: var(--accent-teal); }
  
  .tx-amount { font-weight: 600; text-align: right; }
  .tx-amount.debit { color: var(--text-primary); }
  .tx-amount.credit { color: var(--accent-green); }
  
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px 0 8px;
  }
  
  .page-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .page-btn:hover:not(:disabled) {
    background: var(--accent-teal);
    border-color: var(--accent-teal);
  }
  
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 13px; color: var(--text-muted); }

  /* Category Legend */
  .category-legend {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  
  .legend-label { color: var(--text-secondary); flex: 1; }
  .legend-value { font-weight: 600; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  
  .modal {
    background: var(--bg-card);
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    padding: 28px;
    transform: scale(0.9);
    transition: transform 0.3s;
    border: 1px solid var(--border-color);
  }
  
  .modal-overlay.show .modal {
    transform: scale(1);
  }
  
  .modal-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .form-group {
    margin-bottom: 18px;
  }
  
  .form-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: block;
  }
  
  .form-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .form-input:focus {
    border-color: var(--accent-teal);
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  
  .btn-primary {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-teal), #00a080);
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.2s;
  }
  
  .btn-primary:hover {
    transform: translateY(-1px);
  }
  
  .btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Responsive */
  @media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .budget-grid { grid-template-columns: repeat(2, 1fr); }
  }
  
  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
  }
  
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
    }
    
    .sidebar.open {
      transform: translateX(0);
    }
    
    .main-content {
      margin-left: 0;
      padding: 16px;
    }
    
    .menu-toggle {
      display: flex;
    }
    
    .top-bar {
      flex-wrap: wrap;
    }
    
    .search-box {
      order: 10;
      max-width: 100%;
      flex-basis: 100%;
    }
    
    .stats-grid {
      grid-template-columns: 1fr;
    }
    
    .budget-grid {
      grid-template-columns: 1fr;
    }
    
    .tx-table {
      display: block;
      overflow-x: auto;
    }
    
    .filter-bar {
      overflow-x: auto;
      flex-wrap: nowrap;
      padding-bottom: 8px;
    }
    
    .filter-chip, .filter-select {
      white-space: nowrap;
    }
  }
  
  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .animate {
    animation: fadeInUp 0.4s ease forwards;
  }
  
  .delay-1 { animation-delay: 0.05s; opacity: 0; }
  .delay-2 { animation-delay: 0.1s; opacity: 0; }
  .delay-3 { animation-delay: 0.15s; opacity: 0; }
  .delay-4 { animation-delay: 0.2s; opacity: 0; }
  .delay-5 { animation-delay: 0.25s; opacity: 0; }
  .delay-6 { animation-delay: 0.3s; opacity: 0; }
</style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">💰</div>
      <span class="logo-text">MKiT</span>
    </div>
    
    <nav class="nav-section">
      <div class="nav-item active" onclick="switchTab('overview')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>總覽</span>
      </div>
      <div class="nav-item" onclick="switchTab('budget')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>預算</span>
      </div>
      <div class="nav-item" onclick="switchTab('analytics')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>分析</span>
      </div>
      
      <div class="nav-divider"></div>
      
      <div class="nav-item">

<script>
// ============ DATA ============
const allTransactions = [

  { channel: 'cathay', category: '娛樂', amount: -890, month: '4月', year: '2026', name: '電影節門票' },
  { channel: 'hsbc', category: '餐飲', amount: -420, month: '4月', year: '2026', name: '日本料理' },
  { channel: 'alipay', category: '購物', amount: -156, month: '4月', year: '2026', name: '超市購物' },
  { channel: 'cathay', category: '交通', amount: -320, month: '3月', year: '2026', name: '打的士' },
  { channel: 'alipay', category: '餐飲', amount: -280, month: '3月', year: '2026', name: '茶餐廳' },
  { channel: 'hsbc', category: '數位服務', amount: -89, month: '3月', year: '2026', name: 'Netflix 訂閱' },
  { channel: 'cathay', category: '購物', amount: -1200, month: '2月', year: '2026', name: '春季大減價' },
  { channel: 'alipay', category: '娛樂', amount: -450, month: '2月', year: '2026', name: '酒吧聚會' },
  { channel: 'hsbc', category: '餐飲', amount: -380, month: '1月', year: '2026', name: '生日聚餐' },
  { channel: 'cathay', category: '收入', amount: 15000, month: '1月', year: '2026', name: '月薪' },
  { channel: 'alipay', category: '購物', amount: -2100, month: '1月', year: '2026', name: '淘寶年貨' },
  { channel: 'hsbc', category: '交通', amount: -520, month: '12月', year: '2025', name: '聖誕節交通費' },
  { channel: 'cathay', category: '娛樂', amount: -1800, month: '12月', year: '2025', name: '聖誕派對' },
  { channel: 'alipay', category: '購物', amount: -3500, month: '12月', year: '2025', name: '聖誕禮物' },
  { channel: 'cathay', category: '收入', amount: 15000, month: '12月', year: '2025', name: '月薪' }
];

// Budget data
const budgets = {
  '娛樂': { limit: 3000, spent: 2948 },
  '購物': { limit: 2000, spent: 1134 },
  '餐飲': { limit: 1500, spent: 640 },
  '數位服務': { limit: 600, spent: 522 },
  '交通': { limit: 500, spent: 239 }
};

// ============ STATE ============
let currentChannel = 'all';
let currentYear = 'all';
let currentMonth = 'all';
let currentCat = 'all';
let currentPage = 1;
let searchQuery = '';
const itemsPerPage = 10;
let donutChart, trendChart;
let currentTheme = 'dark';

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  updateGreeting();
  updateTime();
  setInterval(updateTime, 1000);
  initCharts();
  buildTransactionList();
  updateStats();
  buildBudgetGrid();
  buildCategoryLegend();
});

// Theme
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeIcon').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  
  // Re-render charts with new colors
  setTimeout(() => {
    initCharts();
    buildTransactionList();
  }, 100);
}

// Greeting & Time
function updateGreeting() {
  const hour = new Date().getHours();
  const greeting = hour < 12 ? '早晨' : hour < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = greeting;
}

function updateTime() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  document.querySelector('.status-time')?.remove();
}

// Sidebar toggle (mobile)
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============ FILTERS ============
function filterChannel(ch) {
  currentChannel = ch;
  document.querySelectorAll('.filter-group:nth-child(2) .filter-chip').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(ch === 'all' ? '全部' : ch === 'cathay' ? '國泰' : ch === 'hsbc' ? 'HSBC' : 'Alipay'));
  });
  currentPage = 1;
  buildTransactionList();
  updateStats();
  updateCharts();
}

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.filter-group:nth-child(3) .filter-chip').forEach(el => {
    const catName = el.textContent.replace(/[🎭🛍️🍔📱🚗💰]/g, '').trim();
    const catMap = { '娛樂': '娛樂', '購物': '購物', '餐飲': '餐飲', '數位': '數位服務', '交通': '交通', '收入': '收入', '全部': 'all' };
    el.classList.toggle('active', cat === 'all' ? catName === '全部' : catName === cat || (cat !== 'all' && catName === cat));
  });
  currentPage = 1;
  buildTransactionList();
  updateStats();
  updateCharts();
}

function applyFilters() {
  currentYear = document.getElementById('filterYear').value;
  currentMonth = document.getElementById('filterMonth').value;
  currentPage = 1;
  buildTransactionList();
  updateStats();
  updateCharts();
}

function handleSearch(query) {
  searchQuery = query.toLowerCase();
  currentPage = 1;
  buildTransactionList();
}

// ============ GET FILTERED ============
function getFilteredTransactions() {
  return allTransactions.filter(t => {
    if (currentChannel !== 'all' && t.channel !== currentChannel) return false;
    if (currentYear !== 'all' && t.year !== currentYear) return false;
    if (currentMonth !== 'all' && t.month !== currentMonth) return false;
    if (currentCat !== 'all' && t.category !== currentCat) return false;
    if (searchQuery && !t.name.toLowerCase().includes(searchQuery) && !t.category.toLowerCase().includes(searchQuery)) return false;
    return true;
  });
}

// ============ TRANSACTIONS ============
function buildTransactionList() {
  const filtered = getFilteredTransactions();
  const txList = document.getElementById('txList');
  const txCount = document.getElementById('txCount');
  
  txCount.textContent = filtered.length + ' 筆交易';
  
  const totalPages = Math.ceil(filtered.length / itemsPerPage);
  if (currentPage > totalPages) currentPage = totalPages || 1;
  const startIdx = (currentPage - 1) * itemsPerPage;
  const pageTx = filtered.slice(startIdx, startIdx + itemsPerPage);
  
  let html = '';
  pageTx.forEach(t => {
    const iconBg = {
      '娛樂': 'rgba(255,107,107,0.2)',
      '購物': 'rgba(255,217,61,0.2)',
      '餐飲': 'rgba(107,203,255,0.2)',
      '數位服務': 'rgba(168,85,247,0.2)',
      '交通': 'rgba(74,222,128,0.2)',
      '收入': 'rgba(74,222,128,0.2)'
    }[t.category] || 'rgba(255,255,255,0.1)';
    
    const icon = {
      '娛樂': '🎭', '購物': '🛍️', '餐飲': '🍔',
      '數位服務': '📱', '交通': '🚗', '收入': '💰'
    }[t.category] || '📦';
    
    const cardClass = t.channel === 'cathay' ? 'cathay' : t.channel === 'hsbc' ? 'hsbc' : 'alipay';
    const cardName = t.channel === 'cathay' ? '國泰' : t.channel === 'hsbc' ? 'HSBC' : 'Alipay';
    const amountClass = t.amount < 0 ? 'debit' : 'credit';
    const amountPrefix = t.amount < 0 ? '-' : '+';
    
    html += `
      <tr>
        <td><div class="tx-icon-cell" style="background:${iconBg}">${icon}</div></td>
        <td>
          <div class="tx-name">${t.name}</div>
          <div class="tx-meta">
            <span>${t.category}</span>
            <span class="tx-card-tag ${cardClass}">${cardName}</span>
          </div>
        </td>
        <td style="color:var(--text-secondary)">${t.year}年${t.month}</td>
        <td class="tx-amount ${amountClass}">${amountPrefix}HKD ${Math.abs(t.amount).toLocaleString()}</td>
      </tr>`;
  });
  
  if (pageTx.length === 0) {
    html = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-muted)">暫無交易記錄</td></tr>';
  }
  
  txList.innerHTML = html;
  
  // Pagination
  const pagination = document.getElementById('pagination');
  if (totalPages > 1) {
    pagination.innerHTML = `
      <button class="page-btn" onclick="prevPage()" ${currentPage === 1 ? 'disabled' : ''}>◀</button>
      <span class="page-info">${currentPage} / ${totalPages}</span>
      <button class="page-btn" onclick="nextPage()" ${currentPage === totalPages ? 'disabled' : ''}>▶</button>`;
  } else {
    pagination.innerHTML = '';
  }
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    buildTransactionList();
  }
}

function nextPage() {
  const totalPages = Math.ceil(getFilteredTransactions().length / itemsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    buildTransactionList();
  }
}

// ============ STATS ============
function updateStats() {
  const filtered = getFilteredTransactions();
  const income = filtered.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const expense = filtered.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  const net = income - expense;
  const savingsRate = income > 0 ? ((net / income) * 100).toFixed(1) : 0;
  
  document.getElementById('totalIncome').textContent = '+HKD ' + income.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  document.getElementById('totalExpense').textContent = '-HKD ' + expense.toLocaleString();
  document.getElementById('netCashflow').textContent = (net >= 0 ? '+' : '-') + 'HKD ' + Math.abs(net).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  document.getElementById('netCashflow').className = 'stat-value ' + (net >= 0 ? 'positive' : 'negative');
  document.getElementById('savingsRate').textContent = savingsRate + '%';
}

// ============ CHARTS ============
function initCharts() {
  const isLight = currentTheme === 'light';
  const gridColor = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
  const textColor = isLight ? '#666' : '#888';
  
  // Donut Chart
  const ctxDonut = document.getElementById('donutChart').getContext('2d');
  if (donutChart) donutChart.destroy();
  
  const catData = getCategoryData();
  donutChart = new Chart(ctxDonut, {
    type: 'doughnut',
    data: {
      labels: catData.labels,
      datasets: [{
        data: catData.values,
        backgroundColor: ['#ff6b6b', '#ffd93d', '#6bcbff', '#a855f7', '#4ade80', '#ff9f43'],
        borderWidth: 0,
        cutout: '65%'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      }
    }
  });
  
  // Trend Chart
  const ctxTrend = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  
  const monthlyData = getMonthlyTrend();
  trendChart = new Chart(ctxTrend, {
    type: 'line',
    data: {
      labels: monthlyData.labels,
      datasets: [{
        label: '支出',
        data: monthlyData.expense,
        borderColor: '#ff6b6b',
        backgroundColor: 'rgba(255,107,107,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#ff6b6b'
      }, {
        label: '收入',
        data: monthlyData.income,
        borderColor: '#00d4aa',
        backgroundColor: 'rgba(0,212,170,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#00d4aa'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          labels: { color: textColor, usePointStyle: true, padding: 20 }
        }
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: textColor } },
        y: { grid: { color: gridColor }, ticks: { color: textColor } }
      }
    }
  });
}

function updateCharts() {
  initCharts();
  buildCategoryLegend();
}

function getCategoryData() {
  const filtered = getFilteredTransactions().filter(t => t.amount < 0);
  const cats = {};
  filtered.forEach(t => {
    cats[t.category] = (cats[t.category] || 0) + Math.abs(t.amount);
  });
  const labels = Object.keys(cats);
  const values = Object.values(cats);
  return { labels, values };
}

function getMonthlyTrend() {
  const months = ['1月', '2月', '3月', '4月', '5月', '6月'];
  const year = currentYear === 'all' ? '2026' : currentYear;
  
  const expense = months.map(m => {
    const total = allTransactions
      .filter(t => t.month === m && t.year === year && t.amount < 0)
      .reduce((s, t) => s + Math.abs(t.amount), 0);
    return total;
  });
  
  const income = months.map(m => {
    const total = allTransactions
      .filter(t => t.month === m && t.year === year && t.amount > 0)
      .reduce((s, t) => s + t.amount, 0);
    return total;
  });
  
  return { labels: months.map(m => year + '年' + m), expense, income };
}

function buildCategoryLegend() {
  const catData = getCategoryData();
  const total = catData.values.reduce((s, v) => s + v, 0) || 1;
  const colors = ['#ff6b6b', '#ffd93d', '#6bcbff', '#a855f7', '#4ade80', '#ff9f43'];
  const icons = ['🎭', '🛍️', '🍔', '📱', '🚗', '💰'];
  
  const legend = document.getElementById('categoryLegend');
  let html = '';
  catData.labels.forEach((label, i) => {
    const pct = ((catData.values[i] / total) * 100).toFixed(0);
    html += `
      <div class="legend-item">
        <span class="legend-dot" style="background:${colors[i % colors.length]}"></span>
        <span class="legend-label">${icons[i % icons.length]} ${label}</span>
        <span class="legend-value">${pct}%</span>
      </div>`;
  });
  legend.innerHTML = html;
}

// ============ BUDGET ============
function buildBudgetGrid() {
  const grid = document.getElementById('budgetGrid');
  const icons = { '娛樂': '🎭', '購物': '🛍️', '餐飲': '🍔', '數位服務': '📱', '交通': '🚗' };
  const colors = { '娛樂': 'red', '購物': 'yellow', '餐飲': 'green', '數位服務': 'yellow', '交通': 'green' };
  
  let html = '';
  Object.entries(budgets).forEach(([cat, data]) => {
    const pct = Math.min((data.spent / data.limit) * 100, 100);
    const colorClass = pct >= 90 ? 'red' : pct >= 70 ? 'yellow' : 'green';
    const isOver = data.spent > data.limit;
    
    html += `
      <div class="budget-item">
        <div class="budget-item-header">
          <div class="budget-cat"><span>${icons[cat] || '📦'}</span> ${cat}</div>
          <div class="budget-amounts">HKD ${data.spent.toLocaleString()} / ${data.limit.toLocaleString()}</div>
        </div>
        <div class="budget-bar-bg">
          <div class="budget-bar-fill ${colorClass}" style="width:${pct}%"></div>
        </div>
        ${isOver ? '<div class="budget-alert">⚠️ 已超支！</div>' : ''}
      </div>`;
  });
  
  grid.innerHTML = html;
}

function openBudgetModal() {
  document.getElementById('budgetModal').classList.add('show');
}

function closeBudgetModal() {
  document.getElementById('budgetModal').classList.remove('show');
}

function saveBudget() {
  const cat = document.getElementById('budgetCat').value;
  const limit = parseFloat(document.getElementById('budgetLimit').value);
  if (cat && limit) {
    budgets[cat] = { limit, spent: budgets[cat]?.spent || 0 };
    buildBudgetGrid();
    closeBudgetModal();
  }
}

// ============ MONTH PICKER ============
function openMonthPicker() {
  document.getElementById('monthModal').classList.add('show');
}

function closeMonthPicker() {
  document.getElementById('monthModal').classList.remove('show');
}

function applyMonthPicker() {
  const year = document.getElementById('pickerYear').value;
  const month = document.getElementById('pickerMonth').value;
  document.getElementById('currentMonth').textContent = year + '年' + month;
  document.getElementById('filterYear').value = year;
  document.getElementById('filterMonth').value = month;
  applyFilters();
  closeMonthPicker();
}

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event?.target?.closest('.nav-item')?.classList.add('active');
  
  // Hide all sections, show selected
  document.querySelectorAll('.stats-grid, .filter-bar, .charts-grid, .budget-section, .tx-section').forEach(el => {
    el.style.display = 'none';
  });
  
  if (tab === 'overview') {
    document.querySelectorAll('.stats-grid, .filter-bar, .charts-grid, .budget-section, .tx-section').forEach(el => {
      el.style.display = '';
    });
  } else if (tab === 'budget') {
    document.querySelectorAll('.stats-grid, .filter-bar, .budget-section').forEach(el => {
      el.style.display = '';
    });
    document.getElementById('budgetSection').style.display = '';
  }
  
  toggleSidebar();
}
</script>
